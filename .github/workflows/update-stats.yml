# Refreshes public/stats.json (LeetCode, Codeforces, CodeChef, GitHub) once a day.
# The commit to main triggers a Vercel redeploy, so the site shows the new numbers.
name: Update coding stats

on:
  schedule:
    - cron: '30 0 * * *' # daily at 00:30 UTC (06:00 IST)
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats
        run: node scripts/fetch-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher GitHub API rate limit

      - name: Commit if changed
        id: commit
        run: |
          # updatedAt changes on every run, so this commits daily — that keeps the
          # site's "updated X ago" label honest even when no numbers moved.
          if git diff --quiet -- public/stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats.json
          git commit -m "chore: update coding stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Optional: if Vercel doesn't deploy commits made by the Actions bot, create a
      # Deploy Hook in Vercel (Project → Settings → Git → Deploy Hooks) and save its
      # URL as the repository secret VERCEL_DEPLOY_HOOK.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
